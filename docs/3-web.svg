<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Web path: a client asks the DNS container, which answers home.arpa itself and sends other names through AdGuard to Quad9; every example.com name points at the nginx proxy at 10.140.3.16, which forwards plain HTTP to ten backends.">
  <style>
    text { font-family: "Inter", "IBM Plex Sans", "DejaVu Sans", "Segoe UI", system-ui, sans-serif; }
    .bg { fill: #FFFFFF; }
    .bx { fill: #F3F5F8; stroke: #C3CBD5; }
    .zone { fill: #F3F5F8; stroke: #12806A; stroke-width: 1.6; }
    .grp { fill: none; stroke: #12806A; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .ttl { font-size: 13px; font-weight: 600; fill: #17202B; }
    .lbl { font-size: 12px; fill: #17202B; }
    .sub, .mono, .el { font-family: "JetBrains Mono", "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, monospace; }
    .sub { font-size: 11px; fill: #586473; }
    .mono { font-size: 12px; fill: #17202B; }
    .el { font-size: 11px; fill: #586473; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
    .ed { stroke: #17202B; stroke-width: 1.4; fill: none; }
    .ah { fill: #17202B; }
    .rule { stroke: #C3CBD5; }
  </style>
  <defs>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  </defs>
  <rect class="bg" width="1000" height="500" rx="8"/>

  <rect class="bx" x="20" y="236" width="170" height="56" rx="4"/>
  <text class="ttl" x="34" y="258">Client</text>
  <text class="sub" x="34" y="276">home WiFi or RAS</text>

  <!-- DNS -->
  <rect class="grp" x="250" y="20" width="380" height="160" rx="6"/>
  <text class="ttl" x="264" y="42">dns - CT 1280 - 10.140.3.53</text>
  <rect class="bx" x="264" y="76" width="120" height="40" rx="4"/>
  <text class="ttl" x="324" y="100" text-anchor="middle">Recursor :53</text>
  <rect class="bx" x="480" y="56" width="136" height="44" rx="4"/>
  <text class="ttl" x="492" y="74">PowerDNS Auth</text><text class="sub" x="492" y="90">home.arpa zone</text>
  <rect class="bx" x="480" y="116" width="136" height="44" rx="4"/>
  <text class="ttl" x="492" y="134">AdGuard Home</text><text class="sub" x="492" y="150">ad/tracker filter</text>
  <line class="ed" x1="384" y1="90" x2="478" y2="78" marker-end="url(#m3)"/>
  <text class="el" x="430" y="74" text-anchor="middle">home.arpa</text>
  <line class="ed" x1="384" y1="104" x2="478" y2="136" marker-end="url(#m3)"/>
  <text class="el" x="424" y="136" text-anchor="middle">other</text>

  <path class="ed" d="M105,236 V96 H262" marker-end="url(#m3)"/>
  <text class="el" x="114" y="88">(1) DNS query</text>

  <line class="ed" x1="616" y1="138" x2="688" y2="138" marker-end="url(#m3)"/>
  <text class="el" x="652" y="131" text-anchor="middle">DoH</text>
  <rect class="bx" x="690" y="116" width="150" height="44" rx="4"/>
  <text class="ttl" x="702" y="134">Quad9</text><text class="sub" x="702" y="150">Cloudflare fallback</text>
  <line class="ed" x1="765" y1="116" x2="765" y2="86" marker-end="url(#m3)"/>
  <rect class="bx" x="690" y="40" width="290" height="44" rx="4"/>
  <text class="ttl" x="702" y="58">Public DNS (registrar)</text><text class="sub" x="702" y="74">*.example.com A -> 10.140.3.16</text>

  <!-- proxy -->
  <line class="ed" x1="190" y1="264" x2="248" y2="264" marker-end="url(#m3)"/>
  <text class="el" x="219" y="256" text-anchor="middle">(2) HTTPS</text>
  <rect class="zone" x="250" y="230" width="380" height="96" rx="4"/>
  <text class="ttl" x="264" y="254">proxy - CT 1260 - 10.140.3.16</text>
  <text class="lbl" x="264" y="276">nginx :443, one Let's Encrypt cert, 10 names</text>
  <text class="sub" x="264" y="296">lego DNS-01, renewal checked daily</text>
  <text class="sub" x="264" y="314">X-Forwarded-For set, never appended</text>

  <line class="ed" x1="630" y1="278" x2="688" y2="278" marker-end="url(#m3)"/>
  <text class="el" x="659" y="270" text-anchor="middle">(3) HTTP</text>

  <!-- backends -->
  <rect class="bx" x="690" y="200" width="290" height="282" rx="4"/>
  <text class="ttl" x="702" y="222">name.example.com</text><text class="sub" x="968" y="222" text-anchor="end">backend, VLAN 1530</text>
  <line class="rule" x1="700" y1="232" x2="970" y2="232"/>
  <text class="mono" x="702" y="252">music</text><text class="lbl" x="968" y="252" text-anchor="end">navidrome .12:4533</text>
  <text class="mono" x="702" y="276">torrent</text><text class="lbl" x="968" y="276" text-anchor="end">qBittorrent .10:8080</text>
  <text class="mono" x="702" y="300">soulseek</text><text class="lbl" x="968" y="300" text-anchor="end">slskd .11:5030</text>
  <text class="mono" x="702" y="324">lidarr</text><text class="lbl" x="968" y="324" text-anchor="end">Lidarr .14:8686</text>
  <text class="mono" x="702" y="348">soularr</text><text class="lbl" x="968" y="348" text-anchor="end">Soularr .14:8265</text>
  <text class="mono" x="702" y="372">panel</text><text class="lbl" x="968" y="372" text-anchor="end">Pterodactyl .15:80 (t480)</text>
  <text class="mono" x="702" y="396">wings</text><text class="lbl" x="968" y="396" text-anchor="end">Wings .15:8080 (t480)</text>
  <text class="mono" x="702" y="420">presence</text><text class="lbl" x="968" y="420" text-anchor="end">Discord bridge .17</text>
  <text class="mono" x="702" y="444">adguard</text><text class="lbl" x="968" y="444" text-anchor="end">AdGuard .53:3000</text>
  <text class="mono" x="702" y="468">dns</text><text class="lbl" x="968" y="468" text-anchor="end">Poweradmin .53:8080</text>
</svg>
