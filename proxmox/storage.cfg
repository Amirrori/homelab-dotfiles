btrfs: btrfs
	path /btrfs
	content import,backup,rootdir,vztmpl,images,iso,snippets
	nodes t480,z440
	prune-backups keep-all=1

dir: local
	path /var/lib/vz
	content vztmpl,backup,rootdir,snippets,iso,images
	prune-backups keep-all=1

dir: homelab
	path /mnt/media/PVE
	content iso,images,vztmpl,rootdir,backup
	is_mountpoint /mnt/media
	nodes z440
	prune-backups keep-all=1
	shared 0

