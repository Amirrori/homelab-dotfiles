# Samba share for the media disk.
[global]
    server role = standalone server
    security = user
    passdb backend = tdbsam
    map to guest = Never

    interfaces = lo man
    bind interfaces only = yes

    server min protocol = SMB3_00
    server max protocol = SMB3_11
    smb ports = 445
    server multi channel support = yes
    smb encrypt = if_required

    aio read size = 1
    aio write size = 1
    use sendfile = yes

    load printers = no
    disable spoolss = yes
    usershare allow guests = no
    usershare max shares = 0

    log file = /var/log/samba/log.%m
    max log size = 1000

[media]
    comment = Home storage
    path = /mnt/media
    browseable = yes
    read only = no
    guest ok = no
    valid users = media
    create mask = 0660
    directory mask = 0770
