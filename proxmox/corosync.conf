logging {
  debug: off
  to_syslog: yes
}

nodelist {
  node {
    name: t480
    nodeid: 2
    quorum_votes: 1
    ring0_addr: 10.140.2.101
  }
  node {
    name: z440
    nodeid: 1
    quorum_votes: 1
    ring0_addr: 10.140.2.100
  }
}

quorum {
  device {
    model: net
    net {
      algorithm: ffsplit
      host: 10.140.2.3
      tls: on
    }
    votes: 1
  }
  provider: corosync_votequorum
}

totem {
  cluster_name: homelab
  config_version: 3
  interface {
    linknumber: 0
  }
  ip_version: ipv4-6
  link_mode: passive
  secauth: on
  token_coefficient: 125
  version: 2
}

