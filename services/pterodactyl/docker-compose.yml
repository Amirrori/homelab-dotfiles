# Pterodactyl Panel - CT 1250 (10.140.3.15). Based on upstream v1.15.1 docker-compose.example.yml.
# Secrets live in .env (chmod 600). Game data is on /var/lib/pterodactyl (sdb), not here.
services:
  database:
    image: mariadb:11
    restart: always
    volumes:
      - /opt/pterodactyl/database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: "<from .env>"
      MYSQL_ROOT_PASSWORD: "<from .env>"
    networks: [backend]
  cache:
    image: redis:alpine
    restart: always
    networks: [backend]
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "10.140.3.15:80:80"   # LAN only; filtered further by pterodactyl-fw DOCKER-USER
    depends_on: [database, cache]
    volumes:
      - /opt/pterodactyl/var/:/app/var/
      - /opt/pterodactyl/nginx/:/etc/nginx/http.d/
      - /opt/pterodactyl/logs/:/app/storage/logs
      - /opt/pterodactyl/php/zz-hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
    environment:
      APP_URL: "https://panel.example.com"
      TRUSTED_PROXIES: "10.140.3.16"
      APP_TIMEZONE: "Etc/UTC"
      APP_SERVICE_AUTHOR: "media@home.arpa"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      PTERODACTYL_TELEMETRY_ENABLED: "false"
      MAIL_FROM: "noreply@home.arpa"
      MAIL_DRIVER: "log"
      MAIL_MAILER: "log"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_PASSWORD: "<from .env>"
      HASHIDS_LENGTH: 8
    networks: [frontend, backend]
networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true   # db + redis: no egress, never published
    ipam:
      config:
        - subnet: 172.30.1.0/24
