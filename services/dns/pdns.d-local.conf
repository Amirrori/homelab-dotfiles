# Home site config, 2026-10-28
launch+=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
local-address=127.0.0.1:5300
disable-axfr=yes
api=yes
api-key=<api-key>
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1
default-soa-content=dns.home.arpa. hostmaster.@ 0 10800 3600 604800 3600
