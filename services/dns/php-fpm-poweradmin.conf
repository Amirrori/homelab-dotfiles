; Poweradmin pool, 2026-10-28
[poweradmin]
user = poweradmin
group = poweradmin
listen = /run/php/poweradmin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[open_basedir] = /opt/poweradmin/:/opt/poweradmin-4.4.3/:/var/lib/powerdns/:/var/lib/poweradmin/
php_admin_value[session.save_path] = /var/lib/poweradmin/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[upload_tmp_dir] = /var/lib/poweradmin/tmp
php_admin_value[sys_temp_dir] = /var/lib/poweradmin/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[memory_limit] = 128M
