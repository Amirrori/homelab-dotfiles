# Proxy CT 1260 shared settings, 2026-10-28.
# Every site inherits these; no site sets its own proxy_set_header.
# (server_tokens off + ssl_protocols are already set in Debian nginx.conf.)
# No access logs (Subsonic API URLs carry auth tokens); error log stays on.
access_log off;
client_max_body_size 100m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

proxy_http_version 1.1;
proxy_set_header Host $host;
# Replace (don't append) the client address: the backends trust this
# proxy's X-Forwarded-For, so a client must not be able to inject its own.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Stream both ways like Caddy did (music downloads, Wings uploads).
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
